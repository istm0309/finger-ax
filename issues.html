<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeCoach · 보완점·단점</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="issues">
<main class="wrap col">
  <div id="tabs"></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="kinds">
    <button class="chip on" data-k="all" id="k-all">전체</button><button class="chip" data-k="보완점" id="k-gap">보완점</button><button class="chip" data-k="단점" id="k-weak">단점</button>
    <select id="sev" style="width:auto;margin-left:auto" aria-label="심각도"><option value="all">심각도: 전체</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
  </div>
  <div class="row">
    <section class="panel" style="flex:1.2"><table><thead><tr><th>심각도</th><th>분류</th><th>내용</th><th>위치</th></tr></thead><tbody id="list"></tbody></table></section>
    <section class="panel col" style="flex:1" id="detail"></section>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
