<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeCoach · 단위 테스트</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="tests">
<main class="wrap">
  <div id="tabs"></div>
  <div class="row">
    <section class="panel" style="flex:1">
      <div id="filters" style="display:flex;gap:8px;margin-bottom:12px"><button class="chip on" data-f="all" id="f-all">전체</button><button class="chip" data-f="ok" id="f-ok">통과</button><button class="chip" data-f="fail" id="f-fail">실패</button></div>
      <table><thead><tr><th>테스트</th><th>요구사항</th><th>결과</th></tr></thead><tbody id="list"></tbody></table>
    </section>
    <section class="panel col" style="flex:1.3" id="detail"></section>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
