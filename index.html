<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeCoach · 코드 제출</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="submit">
<main class="wrap">
  <div class="row">
    <section class="panel col" style="flex:1.6">
      <div><h1>코드를 올리면 AI 코치가 분석해 드려요</h1><div class="muted">단위 테스트 · 보완점 · 대안 비교 · 단점 분석을 한 번에</div></div>
      <div id="modes" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="chip on" data-mode="paste">코드 붙여넣기</button>
        <button class="chip" data-mode="file">파일 업로드</button>
        <button class="chip" data-mode="git">GitHub 저장소</button>
        <button class="chip" id="sample" style="margin-left:auto">예시 코드 넣기</button>
      </div>
      <div id="pane-paste"><textarea id="code" class="code" spellcheck="false" aria-label="분석할 코드"></textarea></div>
      <div id="pane-file" hidden class="panel" style="text-align:center;padding:40px">
        <p class="muted">zip 또는 소스 파일을 고르세요 (최대 50개, 5MB)</p>
        <input type="file" id="file" multiple>
        <p id="filelist" class="muted small">선택된 파일 없음</p>
      </div>
      <div id="pane-git" hidden><input type="url" id="repo" placeholder="https://github.com/사용자/저장소"></div>
      <div class="row" style="gap:12px">
        <select aria-label="언어" style="flex:1"><option>TypeScript</option><option>JavaScript</option><option>Python</option><option>Java</option></select>
        <label class="field" style="flex:2;cursor:pointer"><span class="muted small">요구사항 문서(PRD) 첨부 · 선택</span><br><input type="file" style="max-width:100%"></label>
      </div>
    </section>
    <aside class="panel col" style="flex:1">
      <h2 style="margin:0">분석 항목</h2>
      <div>
        <label class="check"><input type="checkbox" name="item" value="test" checked>단위 테스트 작성·실행</label>
        <label class="check"><input type="checkbox" name="item" value="gap" checked>보완점 찾기 (요구사항 대비)</label>
        <label class="check"><input type="checkbox" name="item" value="alt" checked>다른 코드·라이브러리와 비교</label>
        <label class="check"><input type="checkbox" name="item" value="weak" checked>현재 코드 단점 분석</label>
        <label class="check"><input type="checkbox" name="item" value="fix">개선 코드 자동 제안</label>
      </div>
      <div><div class="muted">분석 깊이</div>
        <div id="depth" style="display:flex;gap:8px;margin-top:6px"><button class="chip">빠르게</button><button class="chip on">보통</button><button class="chip">꼼꼼하게</button></div></div>
      <div style="margin-top:auto">
        <button class="btn lg" id="start">분석 시작</button>
        <div id="hint" class="small" style="color:var(--red);min-height:20px;margin-top:6px"></div>
        <div class="muted small">코드는 분석에만 쓰이고 저장 기간 후 삭제됩니다 · 이 사이트는 샘플 데이터로 동작하는 프로토타입입니다</div>
      </div>
    </aside>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
